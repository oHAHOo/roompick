services:
  mysql:
    image: mysql:8.4
    container_name: roompick-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-roompick}
      MYSQL_USER: ${DB_USERNAME:-roompick}
      MYSQL_PASSWORD: ${DB_PASSWORD:-roompick}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - roompick-mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: roompick-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - roompick-redis-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    container_name: roompick-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - roompick-elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  roompick-mysql-data:
  roompick-redis-data:
  roompick-elasticsearch-data:
