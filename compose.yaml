services:
  mysql:
    image: mysql:8.4
    container_name: roompick-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-roompick}
      MYSQL_USER: ${DB_USERNAME:-roompick}
      MYSQL_PASSWORD: ${DB_PASSWORD:-roompick}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - roompick-mysql-data:/var/lib/mysql

volumes:
  roompick-mysql-data:
