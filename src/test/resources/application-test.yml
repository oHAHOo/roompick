spring:
  datasource:
    url: jdbc:h2:mem:roompick;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 단위·Repository 테스트는 H2와 Hibernate create-drop을 사용합니다.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
