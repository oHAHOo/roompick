spring:
  datasource:
    url: jdbc:h2:mem:roompick;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  sql:
    init:
      mode: never

  data:
    elasticsearch:
      repositories:
        enabled: false

jwt:
  secret: roompick-test-secret-key-roompick-test-secret-key-1234567890
  access-token-validity-seconds: 3600
  refresh-token-validity-seconds: 1209600

portone:
  api:
    base-url: http://localhost
    secret: test-portone-api-secret
    connect-timeout: 1s
    read-timeout: 1s
  store-id: test-store-id
  channel-key: test-channel-key

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    access-key: test-access-key
    secret-key: test-secret-key

place:
  api:
    base-url: http://localhost
    key: test-kakao-rest-api-key
    connect-timeout: 200ms
    read-timeout: 200ms
