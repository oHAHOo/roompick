management:
  server:
    port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      timeout: ${REDIS_TIMEOUT:300ms}

portone:
  api:
    base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
    secret: ${PORTONE_API_SECRET}
    connect-timeout: ${PORTONE_CONNECT_TIMEOUT:3s}
    read-timeout: ${PORTONE_READ_TIMEOUT:5s}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    cdn-domain: ${AWS_S3_CDN_DOMAIN}
    cdn-distribution-id: ${AWS_S3_CDN_DISTRIBUTION_ID}

place:
  api:
    base-url: ${KAKAO_LOCAL_API_BASE_URL:https://dapi.kakao.com}
    key: ${KAKAO_REST_API_KEY}
    connect-timeout: ${KAKAO_LOCAL_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${KAKAO_LOCAL_API_READ_TIMEOUT:3s}
