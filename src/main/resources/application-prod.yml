spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # Flyway/Liquibase 등 마이그레이션 도구가 아직 없어 임시로 update를 사용한다.
    # 마이그레이션 도구 도입 후에는 application-local.yml과 동일하게 validate로 전환한다.
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
