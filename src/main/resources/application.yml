spring:
  application:
    name: roompick
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:roompick-local-dev-only-jwt-secret-please-change-1234567890}
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

roompick:
  cache:
    popular-accommodations:
      single-flight:
        # Redis 300ms 제한보다 여유를 두되 대기 요청의 무제한 점유를 막습니다.
        wait-timeout: ${POPULAR_ACCOMMODATION_SINGLE_FLIGHT_WAIT_TIMEOUT:5s}
