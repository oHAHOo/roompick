spring:
  application:
    name: roompick
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # S3ImageUploader의 파일당 10MB 제한, 관리자 등록 API의 최대 10장 제한과 맞춘 값입니다.
      max-file-size: 10MB
      max-request-size: 105MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:roompick-local-dev-only-jwt-secret-please-change-1234567890}
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # 컨슈머 전용 인스턴스는 Redis를 쓰지 않으므로(대기열 처리는 DB 락만 사용)
      # 이 인스턴스에서는 false로 꺼서 접근 불가능한 Redis 때문에 health가
      # DOWN으로 오검되지 않게 합니다. docs/DEPLOYMENT.md 12절 참고.
      enabled: ${REDIS_HEALTH_ENABLED:true}
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

roompick:
  kafka:
    consumer:
      # 프로듀서(API) 전용 인스턴스에서는 false로 꺼서 Kafka 컨슈머가 뜨지 않게 합니다.
      # 컨슈머 전용 인스턴스와 로컬 개발 환경은 기본값(true)을 그대로 사용합니다.
      # docs/DEPLOYMENT.md 12절 참고.
      enabled: ${KAFKA_CONSUMER_ENABLED:true}
  scheduler:
    # 컨슈머 전용 인스턴스에서는 false로 꺼서 TimeSaleScheduler·SpecialOfferScheduler·
    # WaitlistExpirationScheduler가 중복 실행되지 않게 합니다. API(프로듀서) 인스턴스와
    # 로컬 개발 환경은 기본값(true)을 그대로 사용합니다. docs/DEPLOYMENT.md 12절 참고.
    enabled: ${SCHEDULER_ENABLED:true}
  cors:
    # 로컬 정적 프론트(예: VS Code Live Server, `frontend/` 폴더를 직접 열었을 때의 file 오리진 대응은
    # 브라우저 정책상 CORS로 해결할 수 없으므로 http-server 등으로 서빙하는 것을 권장합니다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
  cache:
    # 동일 장소 검색의 Kakao API 반복 호출을 줄이는 단기 캐시입니다.
    place-search-ttl: ${PLACE_SEARCH_CACHE_TTL:5m}
    popular-accommodations:
      single-flight:
        # Redis 300ms 제한보다 여유를 두되 대기 요청의 무제한 점유를 막습니다.
        wait-timeout: ${POPULAR_ACCOMMODATION_SINGLE_FLIGHT_WAIT_TIMEOUT:5s}

timesale:
  scheduler:
    initial-delay: 30000
    fixed-delay: 30000
