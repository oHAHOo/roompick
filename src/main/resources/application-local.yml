spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:roompick}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:roompick}
    password: ${DB_PASSWORD:roompick}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      timeout: ${REDIS_TIMEOUT:300ms}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}

  flyway:
    locations: classpath:db/migration,classpath:db/dev-migration

portone:
  api:
    base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
    secret: ${PORTONE_API_SECRET}
    connect-timeout: ${PORTONE_CONNECT_TIMEOUT:3s}
    read-timeout: ${PORTONE_READ_TIMEOUT:5s}
    store-id: ${PORTONE_STORE_ID}
    channel-key: ${PORTONE_CHANNEL_KEY}
