spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:roompick}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:roompick}
    password: ${DB_PASSWORD:roompick}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      timeout: ${REDIS_TIMEOUT:300ms}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}

  flyway:
    locations: classpath:db/migration,classpath:db/dev-migration

portone:
  api:
    base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
    secret: ${PORTONE_API_SECRET}
    connect-timeout: ${PORTONE_CONNECT_TIMEOUT:3s}
    read-timeout: ${PORTONE_READ_TIMEOUT:5s}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:roompick-images}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    cdn-domain: ${AWS_S3_CDN_DOMAIN:}
    cdn-distribution-id: ${AWS_S3_CDN_DISTRIBUTION_ID:}

place:
  api:
    base-url: ${KAKAO_LOCAL_API_BASE_URL:https://dapi.kakao.com}
    key: ${KAKAO_REST_API_KEY}
    connect-timeout: ${KAKAO_LOCAL_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${KAKAO_LOCAL_API_READ_TIMEOUT:3s}

roompick:
  search:
    reindex-enabled: ${ACCOMMODATION_SEARCH_REINDEX_ENABLED:false}
    location-engine: ${ACCOMMODATION_LOCATION_SEARCH_ENGINE:ELASTICSEARCH}

management:
  info:
    env:
      enabled: true

info:
  roompick:
    search:
      location-engine: ${ACCOMMODATION_LOCATION_SEARCH_ENGINE:ELASTICSEARCH}
