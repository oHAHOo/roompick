name: 기능 작업
description: 새로운 기능이나 개선 작업을 등록합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자 또는 시스템 관점의 목표를 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 테스트를 포함한 완료 기준을 작성해주세요.
    validations:
      required: true
