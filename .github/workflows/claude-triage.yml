name: Claude Triage

on:
  issues:
    types: [labeled]

jobs:
  triage-plan:
    if: github.event.label.name == 'claude-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Post triage plan comment
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude-triage"
          track_progress: true
          claude_args: |
            --disallowedTools Edit,Write
          prompt: |
            이 이슈에 방금 "claude-triage" 라벨이 붙었습니다.
            코드베이스를 기준으로 이슈 내용을 분석해서, 어떤 방향으로 해결할지 "계획"만 이슈 댓글로 남기세요.

            반드시 지킬 것:
            - 코드를 수정하지 마세요. 브랜치를 만들거나 커밋/PR을 생성하지 마세요.
            - 파일을 새로 만들거나 기존 파일을 편집하지 마세요 (Edit, Write 도구 사용 금지).
            - 이 단계는 실제 구현이 아니라 방향 제시입니다. 실제 구현은 별도로 진행됩니다.
            - 댓글은 최대한 짧게 작성하세요. 이슈 내용 요약, 관련 파일 목록, 배경 설명 등은 쓰지 마세요.

            댓글에는 아래 두 항목만 포함하세요:
            1. 접근 방식: 어떤 방향으로 해결할지 핵심만 3~5줄 이내로
            2. 결정 필요 사항: 진행 전 사람이 결정해야 할 것이 있으면 명시 (없으면 "없음"이라고만 적기)
