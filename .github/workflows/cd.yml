name: CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: roompick-production-cd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/imsun9/roompick-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get runner public IP
        id: ip
        run: |
          set -euo pipefail
          IP=$(curl -sf https://checkip.amazonaws.com)
          if [ -z "$IP" ]; then
            echo "failed to resolve runner public IP" >&2
            exit 1
          fi
          echo "ip=${IP}" >> "$GITHUB_OUTPUT"

      - name: Allow runner IP for SSH
        id: allow
        run: |
          set -euo pipefail
          RULE_ID=$(aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.ip.outputs.ip }}/32,Description=gha-cd-${{ github.run_id }}}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)
          echo "rule_id=${RULE_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker pull ${{ env.IMAGE }}:${{ github.sha }}

            if ! sudo docker network inspect roompick-net > /dev/null 2>&1; then
              echo "roompick-net Docker network not found on EC2 host — aborting deploy, existing container left untouched" >&2
              exit 1
            fi

            REDIS_CONTAINER=redis
            if ! sudo docker inspect "$REDIS_CONTAINER" > /dev/null 2>&1; then
              echo "Redis container ($REDIS_CONTAINER) not found — aborting deploy, existing container left untouched" >&2
              exit 1
            fi

            REDIS_RUNNING=$(sudo docker inspect --format '{{.State.Running}}' "$REDIS_CONTAINER" 2>/dev/null || true)
            if [ "$REDIS_RUNNING" != "true" ]; then
              echo "Redis container ($REDIS_CONTAINER) is not running — aborting deploy, existing container left untouched" >&2
              exit 1
            fi

            REDIS_NETWORK=$(sudo docker inspect \
              --format '{{index .NetworkSettings.Networks "roompick-net"}}' \
              "$REDIS_CONTAINER" 2>/dev/null || true)

            if [ -z "$REDIS_NETWORK" ] || [ "$REDIS_NETWORK" = "<no value>" ]; then
              echo "Redis is not connected to roompick-net — aborting deploy, existing container left untouched" >&2
              exit 1
            fi

            sudo docker stop roompick-backend || true
            sudo docker rm roompick-backend || true
            sudo docker run -d --name roompick-backend \
              --network roompick-net \
              --env-file /home/ec2-user/app/.env.prod \
              -p 8080:8080 \
              -p 127.0.0.1:8081:8081 \
              --restart unless-stopped \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ env.IMAGE }}:${{ github.sha }}
            sudo docker image prune -af

      - name: Smoke test - app and DB reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -sf --connect-timeout 2 --max-time 5 "http://${{ secrets.EC2_HOST }}:8080/api/v1/accommodations" > /dev/null; then
              echo "smoke test passed"
              exit 0
            fi
            echo "not ready yet, retry $i"
            sleep 2
          done
          echo "smoke test failed after retries" >&2
          exit 1

      - name: Revoke runner IP
        if: always() && steps.allow.outputs.rule_id != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --security-group-rule-ids ${{ steps.allow.outputs.rule_id }}
